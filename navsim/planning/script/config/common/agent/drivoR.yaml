_target_: navsim.agents.drivoR.drivor_agent.DrivoRAgent

config:

  b2d: false # training for navsim

  shared_refiner: false
  ref_num: 4 # number of refining steps
  scorer_ref_num: 4

  proposal_num: 64 # number of proposals (trajectories)
  num_poses: 8 # size if the trajectories

  num_scene_tokens: 16 
  one_token_per_traj: true
  full_history_status: false

  long_trajectory_additional_poses: -1 # to load additional poses (not use currently in this version)

  noc: 1.0 
  dac: 1.0
  ddc: 0.0
  ttc: 5.0
  ep: 5.0
  comfort: 2.0

  tf_d_model: 256 # general feature size of the model
  tf_d_ffn: 1024 # hidden size of the heads

  ####################
  # sensor config
  cam_f0: [3]
  cam_l0: [3]
  cam_l1: []
  cam_l2: []
  cam_r0: [3]
  cam_r1: []
  cam_r2: []
  cam_b0: [3]
  lidar_pc: []


  ####################
  # image branch params
  image_size: [1148, 672] # input image size
  
  image_backbone:
    model_name: timm/vit_small_patch14_reg4_dinov2.lvd142m
    model_weights: weights/vit_small_patch14_reg4_dinov2.lvd142m/model.safetensors
    use_lora: true
    finetune: false
    lora_rank: 32
    focus_front_cam: false
    use_feature_pooling: false
    compress_fc: false


  # fov: [[-50., -50., -5.], [50., 50., 5.]] # simplebev field of view
  # voxel_grid: [100, 100, 8] # simple voxel grid size 
  # bev_encoder_conv_only: true # true, drop the classifier | false, classifier thus one scene vector

  #####################
  # Lidar branch params
  lidar_min_x: -35
  lidar_max_x: 35
  lidar_min_y: -35
  lidar_max_y: 35
  lidar_image_size: [518, 518] # input image size
  lidar_hist_max_per_pixel: 5
  lidar_max_height: 100.0
  lidar_split_height: 0.2
  lidar_use_ground_plane: true
  lidar_backbone:
    model_name: timm/vit_small_patch14_reg4_dinov2.lvd142m
    model_weights: weights/vit_small_patch14_reg4_dinov2.lvd142m/model.safetensors
    use_lora: true
    finetune: false
    lora_rank: 32
    in_chans: 2 # 2 if use ground plane, 1 otherwise


  ####################
  # scorer params
  double_score: false
  agent_pred: false
  area_pred: false
  bev_map: false
  bev_agent: false
  refiner_num_heads: 1
  refiner_ls_values: 0.0
  
  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    time_horizon: 4
    interval_length: 0.5

  # LAW-style latent world model (访问路径: config.world_model.*)
  #
  # enabled     : 整个实验是否包含 world model (决定模块是否创建, 不在训练中改写)
  # start_epoch : 从哪个 epoch 起真正启用 world-model training branch
  #               0  => 等价于从头 joint training
  #               15 => 前 15 epoch 只训 DrivoR, 之后才加入 world supervision
  world_model:
    enabled: true
    start_epoch: 15

    future_offset_frames: 1

    # soft-argmin temperature for world-model action selection:
    # 每帧动作由全部 proposal 按 softmax(-match_error / T) 加权平均得到,
    # T 越小越接近硬 argmin, 越大越平滑 (梯度覆盖越广).
    action_temperature: 1.0

    num_layers: 2
    nhead: 8
    dim_feedforward: 1024
    dropout: 0.0

    use_heading: false

    detach_target: true


loss:
  _target_: navsim.agents.drivoR.layers.losses.drivor_loss.DrivoRLoss
  trajectory_weight: 1.0
  inter_weight: 0.0
  sub_score_weight: 0.0
  final_score_weight: 1.0
  pred_ce_weight: 1.0
  pred_l1_weight: 0.1
  pred_area_weight: 2.0
  prev_weight: 0.0
  agent_class_weight: 1.0
  agent_box_weight: 0.1
  bev_semantic_weight: 1.0
  div_weight: 0.0
  world_loss_weight: 0.03


checkpoint_path: ''
# 训练时热启动权重 (strict=False 加载, 允许跨配置)。
# 留空则从头训练。与 checkpoint_path 不同, 它不影响训练/eval 模式判断。
warm_start_path: ''
lr_args:
  name: AdamW
  base_lr: 5e-4
  base_batch_size: 64
scheduler_args:
  num_epochs: ${trainer.params.max_epochs}
  # navtrain 实际场景数。用于 T_max = ceil(dataset_size / global_batch) * num_epochs,
  # 所以必须等于真实训练集大小, 否则 LR 会在训练结束前归零 (甚至反向回升)。
  # 旧值 85000 对不上: baseline 真实为 ~102592, 且 world_model 未来帧过滤曾把
  # 训练集压到 ~84736, 使该值恰好"看起来"正确。dataloader 修好后恢复 ~102640。
  dataset_size: 102640 # for navsim (navtrain scene count)

batch_size: ${dataloader.params.batch_size}
num_gpus: 1 # the batchsize is per gpu --> need to update for steps

progress_bar: true # default progress bar. if false replace by a console print every 100 iterations (better for JZ)